function showLightbox(){const item=lightboxImages[lightboxIndex];if(!item)return;$('lb-image').src=item.src;$('lb-image').alt=item.alt;$('lb-counter').textContent=(lightboxIndex+1)+' / '+lightboxImages.length;$('lb-caption').textContent=item.alt;$('lb-close').setAttribute('aria-label',t('closeGallery')||'Close');$('lb-prev').setAttribute('aria-label',t('prevPhoto')||'Previous');$('lb-next').setAttribute('aria-label',t('nextPhoto')||'Next')}
function moveLightbox(delta){if(!lightboxImages.length)return;lightboxIndex=(lightboxIndex+delta+lightboxImages.length)%lightboxImages.length;showLightbox()}
function closeLightbox(){$('lightbox').classList.remove('open');document.body.style.overflow='';$('lb-image').removeAttribute('src')}
$('lb-close').onclick=closeLightbox;$('lb-prev').onclick=()=>moveLightbox(-1);$('lb-next').onclick=()=>moveLightbox(1);
$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox()});
$('lightbox').addEventListener('touchstart',e=>{lightboxStartX=e.changedTouches[0].screenX},{passive:true});
$('lightbox').addEventListener('touchend',e=>{if(lightboxStartX===null)return;const dx=e.changedTouches[0].screenX-lightboxStartX;if(Math.abs(dx)>45)moveLightbox(dx<0?1:-1);lightboxStartX=null},{passive:true});
document.addEventListener('keydown',e=>{if(!$('lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')moveLightbox(-1);if(e.key==='ArrowRight')moveLightbox(1)});

$('lang').onchange=e=>{language=e.target.value;translate()};$('explore').onclick=()=>document.getElementById('experiences').scrollIntoView({behavior:'smooth'});window.onpopstate=()=>{if(location.hash){const s=data?.services.find(x=>'#'+encodeURIComponent(x.slug)===location.hash);if(s){current=s;showDetail(s,false);return}}backHome()};fetch('./catalog.json?v=pisa-1', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog.json missing');return r.json()}).then(j=>{data=j;translate();if(location.hash){const s=data.services.find(x=>'#'+encodeURIComponent(x.slug)===location.hash);if(s){current=s;showDetail(s,false)}}}).catch(e=>{$('cards').innerHTML='<p class="muted">Catalog data could not be loaded. Check that catalog.json is next to index.html.</p>';console.error(e)});
</script></body></html>
